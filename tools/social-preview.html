<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Hermes Walls Lab — social preview artwork</title>
<link rel="stylesheet" href="../css/fonts.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #f5f5f7; color: #1d1d1f; font-family: Inter, sans-serif; }
main { height: 100%; padding: 56px 64px; display: grid; grid-template-columns: 448px 1fr; gap: 40px; align-items: center; }
.brand { display: flex; align-items: center; gap: 14px; color: #0066cc; font-size: 19px; font-weight: 600; }
.brand svg { width: 44px; height: 44px; padding: 10px; border-radius: 11px; background: #0066cc; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
h1 { font-size: 64px; line-height: 1.03; letter-spacing: -2.6px; margin: 28px 0 24px; font-weight: 700; }
p { font-size: 25px; line-height: 1.4; margin: 0; }
.fa { font-family: Vazirmatn, sans-serif; font-size: 26px; margin-top: 10px; text-align: left; }
.details { display: flex; gap: 10px; margin-top: 32px; }
.details span { border: 1px solid #d2d2d7; border-radius: 999px; background: white; padding: 9px 14px; font-size: 15px; font-weight: 600; }
.product { margin: 0; min-width: 0; }
.product img { display: block; width: 100%; height: auto; border: 1px solid #d2d2d7; border-radius: 18px; }
figcaption { margin-top: 20px; font-size: 17px; line-height: 1.5; color: #515154; }
</style>
</head>
<body>
<main>
  <section aria-labelledby="title">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>INTERACTIVE SECURITY LAB</div>
    <h1 id="title">Hermes<br>Walls Lab</h1>
    <p>Explore defense in depth.</p>
    <p class="fa" lang="fa" dir="rtl">دفاع چندلایه را تجربه کنید.</p>
    <div class="details"><span>English / <b lang="fa" dir="rtl" style="font-family: Vazirmatn, sans-serif">فارسی</b></span><span>Offline-ready PWA</span></div>
  </section>
  <figure class="product">
    <img src="../screenshots/wide.png" width="1440" height="900" alt="Hermes Walls Lab showing wall controls, the architecture map, and modeled attacks.">
    <figcaption>Flip a wall. Launch an attack. See what changes.<br><span lang="fa" dir="rtl" style="display: inline-block; font-family: Vazirmatn, sans-serif">یک لایهٔ دفاعی را خاموش کنید و نتیجهٔ حمله را ببینید.</span></figcaption>
  </figure>
</main>
</body>
</html>
