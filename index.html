<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermes Walls Lab</title>
<meta name="description" content="An interactive, bilingual (English / فارسی) lab for the six-layer Hermes-on-Telegram hardening design.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1826" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Walls Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230d7a6f'/%3E%3Cg transform='translate(32 33) scale(1.65) translate(-12 -12)' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z'/%3E%3Cpath d='M9 12l2 2 4-4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="i18n/languages.js"></script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" data-view="map">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div><b>Hermes Walls Lab</b><span data-i18n="brandSub"></span></div>
    </div>
    <button class="ibtn ptog ptog-l" type="button" id="togL" aria-pressed="true" aria-controls="vWalls"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><rect class="bar" x="4.2" y="5.2" width="4" height="13.6" rx="1" stroke="none"/></svg></button>
    <div class="grow"></div>
    <button class="addbtn" type="button" id="addBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20.5c.7-3.7 3.4-6.2 6.5-6.2s5.8 2.5 6.5 6.2"/><path class="plus" d="M19 7.5v7M15.5 11h7"/></svg><span data-i18n="addFriend"></span></button>
    <button class="score" id="score" type="button">
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="bgc" cx="18" cy="18" r="14"/><circle class="fg" id="ringFg" cx="18" cy="18" r="14" stroke-dasharray="87.96" stroke-dashoffset="0"/></svg>
      <span><b id="scoreTxt">15/15</b> <small data-i18n="scoreSmall"></small></span>
    </button>
    <div class="sel-wrap">
      <label for="preset" data-i18n="scenario"></label>
      <select class="preset" id="preset">
        <option value="hardened" data-i18n="pr_hardened"></option>
        <option value="bare" data-i18n="pr_bare"></option>
        <option value="netonly" data-i18n="pr_netonly"></option>
        <option value="nosandbox" data-i18n="pr_nosandbox"></option>
        <option value="keysinbox" data-i18n="pr_keysinbox"></option>
        <option value="sharedbridge" data-i18n="pr_sharedbridge"></option>
        <option value="custom" disabled data-i18n="pr_custom"></option>
      </select>
    </div>
    <button class="ibtn ptog ptog-r" type="button" id="togR" aria-pressed="true" aria-controls="vSide"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M15 4v16"/><rect class="bar" x="15.8" y="5.2" width="4" height="13.6" rx="1" stroke="none"/></svg></button>
    <button class="langbtn" type="button" id="langBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langTxt"></span></button>
    <button class="ibtn" type="button" id="themeBtn"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="ibtn" type="button" id="installBtn" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
  </header>

  <div class="main" id="main">
    <aside class="pane walls" id="vWalls">
      <div class="pane-h"><h2 data-i18n="wallsH"></h2><p data-i18n="wallsP"></p></div>
      <div id="wallList"></div>
    </aside>

    <section class="stage on" id="vMap">
      <div class="stage-in">
        <div class="maphead">
          <h1 data-i18n="mapH"></h1>
          <p data-i18n-html="mapP"></p>
          <div class="legend">
            <span><i style="background:var(--accent)"></i><span data-i18n="lgSecret"></span></span>
            <span><i style="background:var(--ok)"></i><span data-i18n="lgOn"></span></span>
            <span><i style="background:var(--bad)"></i><span data-i18n="lgOff"></span></span>
            <span><i style="background:var(--packet)"></i><span data-i18n="lgPacket"></span></span>
          </div>
        </div>
        <div class="playback" role="group" aria-labelledby="playbackLabel">
          <div class="playback-controls">
            <span id="playbackLabel" data-i18n="playbackLabel"></span>
            <label class="playback-auto"><span data-i18n="playbackAuto"></span><span class="sw"><input type="checkbox" role="switch" id="attackAuto" checked><i></i></span></label>
            <span id="attackProgress" role="status" aria-live="polite"></span>
            <button class="chipbtn primary" type="button" id="attackNext" hidden data-i18n="playbackNext"></button>
            <button class="chipbtn" type="button" id="attackStop" hidden data-i18n="playbackStop"></button>
          </div>
          <p id="attackStep" hidden></p>
        </div>
        <div id="mapHost"></div>
        <div class="result" id="result" role="status" aria-live="polite">
          <div class="rk" id="resK">✓</div>
          <div class="rb"><div class="rt" id="resT"></div><div class="rs" id="resS"></div><div class="ra" id="resA"></div></div>
          <button class="rx" type="button" id="resX">×</button>
        </div>
      </div>
      <div class="insp" id="insp" role="dialog"></div>
    </section>

    <aside class="pane side" id="vSide">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="attacks" aria-selected="true" data-i18n="tabAttacks"></button>
        <button class="tab tab-ic" role="tab" data-tab="friends" aria-selected="false" id="frTab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.3c1.7.8 2.8 2.9 3 5.7"/></svg><span class="fcnt" id="frCnt"></span></button>
        <button class="tab" role="tab" data-tab="chat" aria-selected="false" data-i18n="tabChat"></button>
        <button class="tab" role="tab" data-tab="test" aria-selected="false" data-i18n="tabTest"></button>
        <button class="tab" role="tab" data-tab="trace" aria-selected="false" data-i18n="tabTrace"></button>
        <button class="tab" role="tab" data-tab="log" aria-selected="false" data-i18n="tabLog"></button>
      </div>

      <div class="tabp on" id="tp-attacks" role="tabpanel">
        <div class="atk-sum">
          <div class="s1"><b id="nB">0</b><span data-i18n="sumB"></span></div>
          <div class="s2"><b id="nC">0</b><span data-i18n="sumC"></span></div>
          <div class="s3"><b id="nX">0</b><span data-i18n="sumX"></span></div>
        </div>
        <div id="atkList"></div>
      </div>

      <div class="tabp" id="tp-friends" role="tabpanel">
        <div class="fr-top">
          <div><h3 data-i18n="frH"></h3><p data-i18n="frP"></p></div>
          <div class="cap"><div class="cap-row"><span data-i18n="slotsL"></span><b id="capTxt"></b></div><div class="segs" id="capSegs"></div></div>
          <button class="addbtn block" type="button" id="addBtn2"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20.5c.7-3.7 3.4-6.2 6.5-6.2s5.8 2.5 6.5 6.2"/><path class="plus" d="M19 7.5v7M15.5 11h7"/></svg><span data-i18n="addFriend"></span></button>
        </div>
        <div class="fr-list" id="frList"></div>
        <div class="inst" id="instCard" hidden>
          <div class="inst-ic"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M12 7.5v7M9 11.5l3 3 3-3"/></svg></div>
          <div><b data-i18n="installH"></b><span id="instP"></span></div>
          <button class="chipbtn primary" type="button" id="instBtn" data-i18n="installBtn"></button>
        </div>
      </div>

      <div class="tabp" id="tp-chat" role="tabpanel">
        <div class="phone">
          <div class="ph-top"><div class="av">H</div><div><b data-i18n="phoneName"></b><span data-i18n="phoneStatus"></span></div></div>
          <div class="who" role="group">
            <button type="button" data-who="reza" aria-pressed="true" data-i18n="whoReza"></button>
            <button type="button" data-who="thief" aria-pressed="false" data-i18n="whoThief"></button>
            <button type="button" data-who="stranger" aria-pressed="false" data-i18n="whoStranger"></button>
          </div>
          <div class="msgs" id="msgs" aria-live="polite"></div>
          <div class="quick" id="quick"></div>
          <form class="compose" id="compose">
            <input id="chatIn" autocomplete="off">
            <button type="submit" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </form>
        </div>
      </div>

      <div class="tabp" id="tp-test" role="tabpanel">
        <div class="term-wrap">
          <p data-i18n-html="testP"></p>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chipbtn primary" type="button" id="runTest" data-i18n-html="runTest"></button><button class="chipbtn" type="button" id="clearTest" data-i18n="clear"></button></div>
          <div class="term" id="term" dir="ltr"><span class="pr">host$</span> incus exec hermes-reza -- bash /root/selftest.sh <span class="cur"></span></div>
        </div>
      </div>

      <div class="tabp" id="tp-trace" role="tabpanel">
        <div class="pane-h" style="position:static"><h2 id="trTitle" data-i18n="traceH"></h2><p id="trSub" data-i18n="traceP"></p></div>
        <ol class="trace" id="trace"></ol>
      </div>

      <div class="tabp" id="tp-log" role="tabpanel">
        <ul class="log" id="log"><li class="empty" style="display:block" data-i18n="logEmpty"></li></ul>
      </div>
    </aside>
  </div>

  <button class="edge-tab l" type="button" id="edgeL"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span data-i18n="edgeL"></span></button>
  <button class="edge-tab r" type="button" id="edgeR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span data-i18n="edgeR"></span></button>

  <nav class="mtabs" id="mtabs" role="tablist">
    <button type="button" data-view="map" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/></svg><span data-i18n="mMap"></span></button>
    <button type="button" data-view="walls" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></svg><span data-i18n="mWalls"></span><span class="dot" id="mWallDot" hidden></span></button>
    <button type="button" data-view="attacks" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg><span data-i18n="mAttacks"></span><span class="dot" id="mAtkDot" hidden></span></button>
    <button type="button" data-view="friends" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.3c1.7.8 2.8 2.9 3 5.7"/></svg><span data-i18n="mFriends"></span></button>
    <button type="button" data-view="chat" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span data-i18n="mChat"></span></button>
    <button type="button" data-view="test" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg><span data-i18n="mTest"></span></button>
    <button type="button" data-view="trace" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 4v16M5 6h9l-2 3 2 3H5"/></svg><span data-i18n="mTrace"></span></button>
  </nav>
  <button class="fab" type="button" id="fab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6"/><path d="M2.5 20.5c.7-3.7 3.4-6.2 6.5-6.2s5.8 2.5 6.5 6.2"/><path d="M19 7.5v7M15.5 11h7"/></svg></button>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="addlg" id="addDlg" aria-labelledby="dTitle">
  <div class="dwrap" id="dWrap">
    <form class="dcard" id="addForm" novalidate autocomplete="off">
      <div class="grab" aria-hidden="true"></div>
      <div class="dhero" id="dHero">
        <span class="blob b1"></span><span class="blob b2"></span>
        <div class="bigav"><span class="fav" id="dAv">?</span></div>
        <div><h2 id="dTitle" data-i18n="dlgTitle"></h2><p data-i18n="dlgSub"></p></div>
        <button class="ibtn dx" type="button" id="dX"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="dbody">
        <div class="fld" id="fName"><input id="inName" maxlength="24" placeholder=" " dir="auto" enterkeyhint="next"><label for="inName" data-i18n="fName"></label><svg class="ok-ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><small class="hint"></small></div>
        <div class="row2">
          <div class="fld" id="fHandle"><input id="inHandle" maxlength="15" placeholder=" " dir="ltr" autocapitalize="off" spellcheck="false" enterkeyhint="next"><label for="inHandle" data-i18n="fHandle"></label><svg class="ok-ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><small class="hint"></small></div>
          <div class="fld" id="fTg"><input id="inTg" maxlength="12" placeholder=" " dir="ltr" inputmode="numeric" enterkeyhint="done"><label for="inTg" data-i18n="fTg"></label><button class="fbtn" type="button" id="dice"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="15" r="1.4"/><circle cx="15" cy="9" r="1.4"/><circle cx="9" cy="15" r="1.4"/></svg></button><small class="hint"></small></div>
        </div>
        <div><div class="lbl" data-i18n="fColor"></div><div class="swatches" id="swatches" role="radiogroup"></div></div>
        <div><div class="lbl" data-i18n="planH"></div><div class="plan" id="plan"></div></div>
      </div>
      <div class="dfoot">
        <button class="btn-ghost" type="button" id="dCancel" data-i18n="cancel"></button>
        <button class="addbtn go" type="submit" id="dGo"><span data-i18n="provision"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </form>
  </div>
</dialog>
<div class="prov" id="prov" role="status" aria-live="polite"></div>
<canvas class="confetti" id="confetti" hidden></canvas>
<script src="i18n/en.js"></script>
<script src="i18n/fa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
